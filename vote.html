<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人氣票選｜悠遊三鶯</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    :root{
      --vote-blue:#0b789e;
      --vote-deep:#124b63;
      --vote-green:#57c78f;
      --vote-pink:#ef7086;
      --vote-soft:#f3fbfd;
      --vote-text:#5c7f8e;
    }

    body{
      background:var(--vote-soft);
    }

    .vote-page{
      padding:120px 24px 90px;
    }

    .vote-container{
      width:min(1180px,100%);
      margin:0 auto;
    }

    .vote-heading{
      max-width:820px;
      margin:0 auto 38px;
      text-align:center;
    }

    .vote-heading .section-en{
      display:block;
      margin-bottom:8px;
      color:var(--vote-pink);
      font-size:12px;
      font-weight:900;
      letter-spacing:.16em;
    }

    .vote-heading h1{
      margin:0 0 14px;
      color:var(--vote-deep);
      font-size:clamp(38px,6vw,64px);
      line-height:1.15;
      font-weight:900;
    }

    .vote-heading p{
      margin:0 auto;
      max-width:720px;
      color:var(--vote-text);
      font-size:16px;
      line-height:1.85;
    }

    .vote-status{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      max-width:880px;
      margin:0 auto 42px;
      padding:20px 24px;
      border:1px solid rgba(11,120,158,.08);
      border-radius:20px;
      background:#fff;
      box-shadow:0 14px 35px rgba(10,93,126,.07);
    }

    .vote-status strong{
      display:block;
      margin-bottom:5px;
      color:var(--vote-deep);
      font-size:18px;
    }

    .vote-status p{
      margin:0;
      color:var(--vote-text);
      font-size:14px;
      line-height:1.65;
    }

    .vote-status-badge{
      flex:0 0 auto;
      padding:9px 14px;
      border-radius:999px;
      background:#fff3c8;
      color:#9a6d00;
      font-size:13px;
      font-weight:900;
    }


    .line-login-button{flex:0 0 auto;min-height:44px;padding:0 20px;border:0;border-radius:999px;background:#06c755;color:#fff;font-family:inherit;font-size:14px;font-weight:900;cursor:pointer;box-shadow:0 8px 20px rgba(6,199,85,.18)}
    .line-login-button[disabled]{cursor:wait;opacity:.65}
    .vote-status-badge.is-login{background:#e8f8ef;color:#17804b}
    .vote-status-badge.is-error{background:#fff0f0;color:#b84444}

    .works-title{
      display:flex;
      align-items:end;
      justify-content:space-between;
      gap:16px;
      margin-bottom:18px;
    }

    .works-title h2{
      margin:0;
      color:var(--vote-deep);
      font-size:28px;
      font-weight:900;
    }

    .works-title span{
      color:#7898a5;
      font-size:13px;
    }

    .works-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:24px;
    }

    .work-card{
      overflow:hidden;
      border-radius:24px;
      background:#fff;
      box-shadow:0 14px 38px rgba(8,125,167,.08);
      transition:transform .2s ease,box-shadow .2s ease;
    }

    .work-card:hover{
      transform:translateY(-3px);
      box-shadow:0 18px 42px rgba(8,125,167,.12);
    }

    .work-collage{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:2px;
      background:#dcecef;
      cursor:pointer;
    }

    .work-thumb{
      position:relative;
      aspect-ratio:1 / 1;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#eef6f8;
      padding:4px;
    }

    .work-thumb-bg{
      position:absolute;
      inset:-28px;
      background-image:var(--thumb-bg);
      background-position:center;
      background-size:cover;
      filter:blur(26px) saturate(.72);
      opacity:.26;
      transform:scale(1.22);
    }

    .work-thumb::after{
      content:"";
      position:absolute;
      inset:0;
      background:rgba(255,255,255,.34);
      pointer-events:none;
    }

    .work-thumb img{
      position:relative;
      z-index:1;
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
      filter:drop-shadow(0 2px 6px rgba(0,0,0,.06));
    }

    .work-card-body{
      padding:22px;
    }


    .work-meta-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:10px;
    }

    .work-votes{
      color:var(--vote-blue);
      font-size:13px;
      font-weight:900;
      white-space:nowrap;
    }

    .work-number{
      display:inline-flex;
      align-items:center;
      min-height:28px;
      padding:0 11px;
      border-radius:999px;
      background:#fff0f3;
      color:var(--vote-pink);
      font-size:11px;
      font-weight:900;
      letter-spacing:.08em;
    }

    .work-author{
      margin:0 0 8px;
      color:#6b8793;
      font-size:13px;
      font-weight:700;
    }

    .work-author strong{
      color:var(--vote-deep);
      font-weight:900;
    }

    .work-card h3{
      margin:12px 0 18px;
      color:var(--vote-deep);
      font-size:21px;
      line-height:1.45;
      font-weight:900;
    }

    .work-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .work-detail-button,
    .vote-button{
      min-height:48px;
      padding:0 14px;
      border-radius:999px;
      font-family:inherit;
      font-size:14px;
      font-weight:900;
      cursor:pointer;
    }

    .work-detail-button{
      border:2px solid #d2e7ee;
      background:#fff;
      color:var(--vote-blue);
    }

    .vote-button{
      border:0;
      background:linear-gradient(135deg,var(--vote-blue),var(--vote-green));
      color:#fff;
    }


    .vote-button.is-voted{
      background:#e8f8ef;
      color:#17804b;
      box-shadow:none;
    }

    .vote-button[disabled]{
      cursor:not-allowed;
      opacity:.55;
    }

    /* 作品完整內容彈窗 */
    .work-modal{
      position:fixed;
      inset:0;
      z-index:9999;
      display:none;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .work-modal.is-open{
      display:flex;
    }

    .work-modal-backdrop{
      position:absolute;
      inset:0;
      background:rgba(6,33,44,.72);
      backdrop-filter:blur(6px);
    }

    .work-modal-dialog{
      position:relative;
      z-index:1;
      width:min(980px,100%);
      max-height:90vh;
      overflow:auto;
      border-radius:26px;
      background:#fff;
      box-shadow:0 30px 90px rgba(0,0,0,.28);
    }

    .work-modal-close{
      position:sticky;
      top:14px;
      float:right;
      z-index:5;
      width:42px;
      height:42px;
      margin:14px 14px -56px 0;
      border:0;
      border-radius:50%;
      background:rgba(17,67,86,.92);
      color:#fff;
      font-size:26px;
      line-height:1;
      cursor:pointer;
    }

    .work-modal-inner{
      padding:36px;
    }

    .work-modal-kicker{
      color:var(--vote-pink);
      font-size:12px;
      font-weight:900;
      letter-spacing:.12em;
    }

    .work-modal-author{
      margin:8px 0 4px;
      color:#6b8793;
      font-size:14px;
      font-weight:700;
    }

    .work-modal-author strong{
      color:var(--vote-deep);
      font-weight:900;
    }

    .work-modal h2{
      margin:8px 0 18px;
      padding-right:48px;
      color:var(--vote-deep);
      font-size:clamp(28px,4vw,42px);
      line-height:1.3;
      font-weight:900;
    }

    .work-description{
      margin:0 0 28px;
      color:#557987;
      font-size:15px;
      line-height:1.95;
      white-space:pre-line;
    }

    .work-photo-list{
      display:grid;
      gap:20px;
    }

    .work-photo-item{
      overflow:hidden;
      border-radius:18px;
      background:#f5fafb;
    }

    .work-photo-item img{
      display:block;
      width:100%;
      height:auto;
      max-height:76vh;
      object-fit:contain;
      background:#eef6f8;
    }

    .work-photo-title{
      display:none;
      padding:12px 16px 14px;
      color:var(--vote-deep);
      font-size:14px;
      font-weight:800;
    }

    .work-photo-title.has-title{
      display:block;
    }

    .modal-vote-wrap{
      margin-top:28px;
      text-align:center;
    }

    .modal-vote-wrap .vote-button{
      width:min(360px,100%);
      min-height:54px;
      font-size:15px;
    }

    body.work-modal-open{
      overflow:hidden;
    }


    .vote-toast{
      position:fixed;
      left:50%;
      bottom:28px;
      z-index:12000;
      transform:translate(-50%,20px);
      max-width:min(520px,calc(100% - 32px));
      padding:14px 18px;
      border-radius:14px;
      background:rgba(18,75,99,.96);
      color:#fff;
      font-size:14px;
      font-weight:800;
      line-height:1.6;
      box-shadow:0 16px 40px rgba(0,0,0,.2);
      opacity:0;
      pointer-events:none;
      transition:.22s ease;
    }
    .vote-toast.is-show{opacity:1;transform:translate(-50%,0)}
    .vote-toast.is-error{background:rgba(176,61,61,.96)}

    @media(max-width:900px){
      .works-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }
    }

    @media(max-width:640px){
      .vote-page{
        padding:100px 16px 65px;
      }

      .vote-status{
        align-items:flex-start;
        flex-direction:column;
      }

      .works-grid{
        grid-template-columns:1fr;
      }

      .work-actions{
        grid-template-columns:1fr;
      }

      .work-modal{
        padding:10px;
      }

      .work-modal-inner{
        padding:26px 18px 22px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="index.html" aria-label="悠遊三鶯首頁">
        <img class="site-logo-image" src="images/logo.png" alt="悠遊三鶯">
      </a>

      <button class="menu-toggle" type="button" aria-label="開啟選單" aria-controls="main-nav" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <nav class="main-nav" id="main-nav">
        <a href="index.html#news">最新消息</a>
        <a href="index.html#about">活動介紹</a>
        <a href="index.html#events">系列活動</a>
        <a href="index.html#shops">合作店家優惠</a>
        <a href="index.html#photo">攝影比賽專區</a>
        <a href="index.html#video">影音專區</a>
      </nav>
    </div>
  </header>

  <main class="vote-page">
    <div class="vote-container">

      <section class="vote-heading">
        <span class="section-en">PHOTO CONTEST VOTE</span>
        <h1>我的四格旅行<br>人氣票選</h1>
        <p>
          每組作品由 4 張照片共同呈現一段三鶯旅行故事。
          欣賞完整作品後，登入 LINE 為你最喜歡的作品投下一票。
        </p>
      </section>

      <section class="vote-status">
        <div>
          <strong id="login-status-title">正在確認 LINE 登入狀態…</strong>
          <p id="login-status-text">請稍候，系統正在確認你的登入狀態。</p>
        </div>
        <button class="line-login-button" id="line-login-button" type="button" hidden>使用 LINE 登入</button>
        <span class="vote-status-badge" id="login-status-badge">確認中</span>
      </section>

      <div class="works-title">
        <h2>參賽作品</h2>
        <span>目前測試 9 組｜正式上線共 35 組</span>
      </div>

      <section class="works-grid" id="works-grid"></section>
    </div>
  </main>

  <div class="work-modal" id="work-modal" aria-hidden="true">
    <div class="work-modal-backdrop" data-close-work-modal></div>

    <section class="work-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="work-modal-title">
      <button class="work-modal-close" type="button" aria-label="關閉作品" data-close-work-modal>×</button>

      <div class="work-modal-inner">
        <span class="work-modal-kicker" id="work-modal-number"></span>
        <p class="work-modal-author" id="work-modal-author"></p>
        <h2 id="work-modal-title"></h2>
        <p class="work-description" id="work-modal-description"></p>

        <div class="work-photo-list" id="work-modal-photos"></div>

        <div class="modal-vote-wrap">
          <button class="vote-button" id="modal-vote-button" type="button">LINE 登入後投這一票</button>
        </div>
      </div>
    </section>
  </div>

  <div class="vote-toast" id="vote-toast" role="status" aria-live="polite"></div>

  <script>
    /* ==========================
       作品資料
       之後第 10～35 組都加在這裡
    ========================== */
    const works = [
      {
        id: "work01",
        number: "01",
        participant: "崔淑苓",
        title: "捷運三鶯線的三峽地標－台北大學",
        voteCount: 0,
        description: "從三峽捷運線開通之後，觀光客假日擠在三峽老街，其實在三峽老街附近，還有一個台北大學，是一所藏著許多裝置藝術的寶藏學府。\n\n在校園裡，除了風光明媚的心湖，以及深受小朋友喜愛的黑天鵝之外，近年也陸續設置了許多裝置藝術，讓漫步校園的過程多了幾分浪漫與藝術氣息。\n\n如果來到三峽老街吃飽喝足，不妨再走進台北大學，慢慢欣賞這座校園裡的藝術風景，讓一趟三峽旅行，不只停留在美食與老街，也多一份心靈上的收穫。",
        photos: [
          { src: "images/works/work01-01.jpeg", title: "" },
          { src: "images/works/work01-02.jpeg", title: "" },
          { src: "images/works/work01-03.jpeg", title: "" },
          { src: "images/works/work01-04.jpeg", title: "" }
        ]
      },
      {
        id: "work02",
        number: "02",
        participant: "張淑娟",
        title: "三鶯解謎",
        voteCount: 0,
        description: "在充滿遊客與在地人的熱鬧小鎮，跟著主辦單位的謎題一同探索三鶯，是最容易了解當地過去歷史背景的方式。",
        photos: [
          { src: "images/works/work02-01.jpeg", title: "" },
          { src: "images/works/work02-02.jpeg", title: "" },
          { src: "images/works/work02-03.jpeg", title: "" },
          { src: "images/works/work02-04.jpeg", title: "" }
        ]
      },
      {
        id: "work03",
        number: "03",
        participant: "廖芷愉",
        title: "漂亮三峽",
        voteCount: 0,
        description: "「731」不只是一條公車路線，也成為串起三峽風景與地方文化的一條線。這組照片記錄了2026年的「猴遊三峽」活動：從街道上駛過的藍色主題公車、夜色裡的裝置，到山林間醒目的大型看板，以及旅宿空間入口可愛的角色立牌，活動視覺被放進城市、自然與日常生活之中。\n\n藍、綠、黃色彩與圓潤的角色造型，讓原本平凡的交通工具與公共空間，變成一場可以被看見、被拍下，也被記住的地方旅行。對我而言，這些畫面有趣的地方，不只是可愛的視覺，而是地方行銷如何透過設計進入居民與旅人的視線：公車帶人移動，看板指引方向，裝置創造停留，而角色則成為共同的視覺記憶。\n\n從白天到夜晚，從道路到山林，再走進室內，四個場景像是一趟縮小版的三峽旅程，也讓我看見一座城市如何用一套鮮明而親切的視覺語言，邀請人重新認識熟悉的地方。",
        photos: [
          { src: "images/works/work03-01.jpg", title: "" },
          { src: "images/works/work03-02.jpg", title: "" },
          { src: "images/works/work03-03.jpg", title: "" },
          { src: "images/works/work03-04.jpeg", title: "" }
        ]
      },
      {
        id: "work04",
        number: "04",
        participant: "陳韋綺",
        title: "與小夥伴的小旅行",
        voteCount: 0,
        description: "由小夥伴帶領下的三鶯解謎旅行，沿途看著風景、吃著美食，一路破關斬將，最後找到喵喵及藍狗合影留下紀念。",
        photos: [
          { src: "images/works/work04-01.jpg", title: "" },
          { src: "images/works/work04-02.jpg", title: "" },
          { src: "images/works/work04-03.jpg", title: "" },
          { src: "images/works/work04-04.jpg", title: "" }
        ]
      },
      {
        id: "work05",
        number: "05",
        participant: "陳衍繹",
        title: "慢行三鶯ｘ鏡頭裡的日常詩意",
        voteCount: 0,
        description: "三鶯的魅力，從來不只是熱門景點的打卡瞬間，而是藏在街頭轉角、車窗外流動的風景、公車裡的輕鬆節奏，以及文化空間裡靜靜綻放的色彩與故事。\n\n這組作品以四張照片串聯一趟屬於自己的三鶯慢旅行：從鶯歌街頭守護著旅人的白色神鳥「守望鶯歌」出發，感受在地街景與生活溫度；搭上三鶯線捷運，從車窗望見高架軌道與住宅群交織的現代日常；再轉乘731「悠遊三鶯」彩繪公車，抵達客家文化園區，與可愛的氣球角色一起展開輕鬆的探索；最後走進室內，讓巨大的紙花裝置與白鷺剪影，訴說三鶯人文與自然交織的細膩感動。\n\n透過鏡頭，記錄的不只是風景，更是沿途發現的人情、交通、藝術與生活節奏——這就是我眼中，最真實、最迷人的三鶯印象。",
        photos: [
          { src: "images/works/work04-01.jpg", title: "" },
          { src: "images/works/work04-02.jpg", title: "" },
          { src: "images/works/work04-03.jpg", title: "" },
          { src: "images/works/work04-04.jpg", title: "" }
        ]
      },
      {
        id: "work06",
        number: "06",
        participant: "柯志勝",
        title: "海山夜行",
        voteCount: 0,
        description: "夜幕低垂，新北市美術館在當代光影與在地人文的交織下，展現出別具神韻的夜間姿態，本組作品以「海山夜行」為核心，紀錄人們漫步於三鶯夜色中的夢幻旅程",
        photos: [
          { src: "images/works/work06-01.jpg", title: "海山夜行" },
          { src: "images/works/work06-02.jpg", title: "暖光微醺" },
          { src: "images/works/work06-03.jpg", title: "璀璨花火" },
          { src: "images/works/work06-04.jpg", title: "天光帷幕" }
        ]
      },
      {
        id: "work07",
        number: "07",
        participant: "陳梅君",
        title: "藍天下的祖師廟.香火不滅",
        voteCount: 0,
        description: "藍天下的祖師廟.香火不滅\n\n藍天下,三峽祖師廟的簷角飛揚,石柱蟠龍靜臥。一縷縷清煙自香爐中緩緩升起,與蒼穹相接,似在訴說千年祈願。\n\n門扉兩側的門神威嚴端立,金光隱現,守護著內殿的莊嚴。遊人輕步而入，手持一束線香,目光虔敬。爐中香火綿延不絕,龍首相對,煙霧繚繞,宛如仙氣遊走。\n\n日影斜照,一位白髮長者立於欄前,緩緩插香。青煙裊鳥,映著廟宇金碧,天地之間,唯餘一份寧靜與永恆的敬意。",
        photos: [
          { src: "images/works/work07-01.jpg", title: "" },
          { src: "images/works/work07-02.jpg", title: "" },
          { src: "images/works/work07-03.jpg", title: "" },
          { src: "images/works/work07-04.jpg", title: "" }
        ]
      },
      {
        id: "work08",
        number: "08",
        participant: "何信良",
        title: "北大巡禮",
        voteCount: 0,
        description: "從正門進入北大，印入眼簾的是圖資大樓以及一顆有著北大校徽和國立台北大學六個大字的石頭，然而在圖資大樓後方直走即是北大中心（心湖），接著往左前方走進鳶飛大道，看到的是NTPU及極限運動場，最後在北大後門，鄰近三鶯線的台北大學站，有著美美的兔子裝置藝術",
        photos: [
          { src: "images/works/work08-01.jpeg", title: "" },
          { src: "images/works/work08-02.jpeg", title: "" },
          { src: "images/works/work08-03.jpeg", title: "" },
          { src: "images/works/work08-04.jpeg", title: "" }
        ]
      },
      {
        id: "work09",
        number: "09",
        participant: "王世慶",
        title: "三峽睡月.信仰與傳承",
        voteCount: 0,
        description: "此次特別以鏡頭記錄**「三鶯大橋」、「祖師廟之晨」、「賽神豬」與「手拉坯」**四個畫面。從一座橋、一道晨光、一場民俗祭典，到一雙塑造陶土的手，希望透過影像，留下三峽與鶯歌最真實的人文風貌。\n\n照片說明：\n《一橋牽兩城-三鶯大橋》\n晨光灑落大漢溪，三鶯大橋橫跨兩岸，串起三峽與鶯歌。這座橋所連結的，不只是兩地的交通，更是兩座城鎮不同而又彼此輝映的人文風景。\n\n《霞光映古廟—祖師廟之晨》\n晨曦初露，霞光染紅天際，古老的三峽祖師廟在晨光與燈火交映下，更顯莊嚴典雅。廟前居民迎著清晨舒展身心，日常生活與百年信仰在此自然交會。\n\n《酬神祈福—賽神豬》\n三峽清水祖師信仰深植地方民間生活，祭典期間的神豬展示，是過往地方酬神文化中格外醒目的景象。\n\n《掌中歲月—手拉胚的傳承》\n陶土隨著轆轤旋轉，在陶藝師傅雙手的拿捏之間，逐漸有了形體，也有了生命。看似簡單的一推、一拉、一收，凝聚的卻是長年累積的經驗與技藝。",
        photos: [
          { src: "images/works/work09-01.jpg", title: "" },
          { src: "images/works/work09-02.jpg", title: "" },
          { src: "images/works/work09-03.jpg", title: "" },
          { src: "images/works/work09-04.jpg", title: "" }
        ]
      }, 
    ];

    const grid = document.getElementById("works-grid");
    const modal = document.getElementById("work-modal");
    const modalNumber = document.getElementById("work-modal-number");
    const modalAuthor = document.getElementById("work-modal-author");
    const modalTitle = document.getElementById("work-modal-title");
    const modalDescription = document.getElementById("work-modal-description");
    const modalPhotos = document.getElementById("work-modal-photos");

    const loginStatusTitle = document.getElementById("login-status-title");
    const loginStatusText = document.getElementById("login-status-text");
    const loginStatusBadge = document.getElementById("login-status-badge");
    const lineLoginButton = document.getElementById("line-login-button");
    const modalVoteButton = document.getElementById("modal-vote-button");
    const voteToast = document.getElementById("vote-toast");

    const LINE_LOGIN_URL = "https://asia-east1-sanying-photo-vote.cloudfunctions.net/lineLogin";
    const SESSION_STATUS_URL = "https://asia-east1-sanying-photo-vote.cloudfunctions.net/sessionStatus";
    const VOTE_STATS_URL = "https://asia-east1-sanying-photo-vote.cloudfunctions.net/voteStats";
    const VOTE_URL = "https://asia-east1-sanying-photo-vote.cloudfunctions.net/vote";

    let currentSession = "";
    let currentUser = null;
    let activeWorkId = "";
    let todayVoteWorkIds = [];
    let remainingVotes = 3;

    let toastTimer = null;

    function showVoteToast(message, isError = false) {
      if (!voteToast) return;
      voteToast.textContent = message;
      voteToast.classList.toggle("is-error", isError);
      voteToast.classList.add("is-show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => voteToast.classList.remove("is-show"), 2600);
    }

    function goToLineLogin() {
      const returnUrl = window.location.origin + window.location.pathname;
      const url = new URL(LINE_LOGIN_URL);
      url.searchParams.set("returnUrl", returnUrl);
      window.location.href = url.toString();
    }

    function updateVoteButtons() {
      const limitReached = remainingVotes <= 0;

      document.querySelectorAll("[data-vote-work]").forEach(button => {
        const workId = button.dataset.voteWork;
        const alreadyVotedThisWork = todayVoteWorkIds.includes(workId);

        button.classList.remove("is-voted");

        if (!currentUser) {
          button.disabled = false;
          button.textContent = "LINE 登入後投票";
          return;
        }

        if (alreadyVotedThisWork) {
          button.disabled = true;
          button.textContent = "今日已投這組";
          button.classList.add("is-voted");
          return;
        }

        if (limitReached) {
          button.disabled = true;
          button.textContent = "今日 3 票已投完";
          return;
        }

        button.disabled = false;
        button.textContent = `投這一票（剩 ${remainingVotes} 票）`;
      });

      if (modalVoteButton) {
        const alreadyVotedThisWork = todayVoteWorkIds.includes(activeWorkId);

        modalVoteButton.classList.remove("is-voted");

        if (!currentUser) {
          modalVoteButton.disabled = false;
          modalVoteButton.textContent = "LINE 登入後投這一票";
        } else if (alreadyVotedThisWork) {
          modalVoteButton.disabled = true;
          modalVoteButton.textContent = "今日已投這組";
          modalVoteButton.classList.add("is-voted");
        } else if (limitReached) {
          modalVoteButton.disabled = true;
          modalVoteButton.textContent = "今日 3 票已投完";
        } else {
          modalVoteButton.disabled = false;
          modalVoteButton.textContent = `投這一票（剩 ${remainingVotes} 票）`;
        }
      }
    }

    function updateVoteCountDisplay(workId) {
      const work = works.find(item => item.id === workId);
      if (!work) return;

      document.querySelectorAll(`[data-vote-count="${workId}"]`).forEach(el => {
        el.textContent = `目前 ${Number(work.voteCount || 0).toLocaleString("zh-TW")} 票`;
      });

      if (activeWorkId === workId && modalNumber) {
        modalNumber.textContent =
          `作品編號 ${work.number} ・ 目前 ${Number(work.voteCount || 0).toLocaleString("zh-TW")} 票`;
      }
    }

    async function loadVoteStats() {
      try {
        const response = await fetch(VOTE_STATS_URL, {
          method: "GET",
          cache: "no-store"
        });

        if (!response.ok) return;

        const data = await response.json();
        const counts = data.counts || {};

        works.forEach(work => {
          work.voteCount = Number(counts[work.id] || 0);
          updateVoteCountDisplay(work.id);
        });
      } catch (error) {
        console.error("voteStats error:", error);
      }
    }

    function setLoggedOut(message) {
      currentUser = null;
      todayVoteWorkIds = [];
      remainingVotes = 3;
      loginStatusTitle.textContent = "LINE 登入後即可投票";
      loginStatusText.textContent = message || "登入 LINE 後即可參與人氣票選。";
      loginStatusBadge.textContent = "尚未登入";
      loginStatusBadge.className = "vote-status-badge";
      lineLoginButton.hidden = false;
      updateVoteButtons();
    }

    function setLoggedIn(user) {
      currentUser = user || {};
      todayVoteWorkIds = Array.isArray(currentUser.todayVoteWorkIds)
        ? currentUser.todayVoteWorkIds
        : [];
      remainingVotes = Number.isFinite(currentUser.remainingVotes)
        ? currentUser.remainingVotes
        : Math.max(0, 3 - todayVoteWorkIds.length);
      const name = currentUser.displayName || currentUser.name || "LINE 使用者";
      loginStatusTitle.textContent = name + "，已登入";
      loginStatusText.textContent =
        remainingVotes > 0
          ? `今天可投 3 票，已投 ${3 - remainingVotes} 票，還有 ${remainingVotes} 票；同一作品不可重複投。`
          : "今天的 3 票已全部投完，明天 00:00（台灣時間）可再投 3 票。";
      loginStatusBadge.textContent = "LINE 已登入";
      loginStatusBadge.className = "vote-status-badge is-login";
      lineLoginButton.hidden = true;
      updateVoteButtons();
    }

    async function checkSession() {
      const params = new URLSearchParams(window.location.search);
      const fromUrl = params.get("session");

      if (fromUrl) {
        currentSession = fromUrl;
        sessionStorage.setItem("sanyingVoteSession", fromUrl);
        const clean = new URL(window.location.href);
        clean.searchParams.delete("session");
        history.replaceState({}, document.title, clean.pathname + clean.search + clean.hash);
      } else {
        currentSession = sessionStorage.getItem("sanyingVoteSession") || "";
      }

      if (!currentSession) {
        setLoggedOut();
        return;
      }

      try {
        const response = await fetch(SESSION_STATUS_URL, {
          method: "GET",
          cache: "no-store",
          headers: {
            "Authorization": `Bearer ${currentSession}`
          }
        });
        const data = await response.json();

        if (!response.ok || data.ok === false || data.loggedIn === false || data.authenticated === false) {
          sessionStorage.removeItem("sanyingVoteSession");
          currentSession = "";
          setLoggedOut(data.message || "登入已失效，請重新登入 LINE。");
          return;
        }

        setLoggedIn(data);
      } catch (error) {
        console.error(error);
        loginStatusTitle.textContent = "登入狀態確認失敗";
        loginStatusText.textContent = "目前無法確認登入狀態，請重新使用 LINE 登入。";
        loginStatusBadge.textContent = "請重新登入";
        loginStatusBadge.className = "vote-status-badge is-error";
        lineLoginButton.hidden = false;
      }
    }

    async function handleVoteIntent(workId) {
      activeWorkId = workId || activeWorkId;
      showVoteToast("已選擇作品，正在準備投票…");

      if (!currentUser) {
        goToLineLogin();
        return;
      }

      if (todayVoteWorkIds.includes(activeWorkId)) {
        showVoteToast("你今天已經投過這件作品了，請選擇其他作品。", true);
        alert("你今天已經投過這件作品了，請選擇其他作品。");
        return;
      }

      if (remainingVotes <= 0) {
        showVoteToast("你今天的 3 票已經全部投完，明天可以再投 3 票。", true);
        alert("你今天的 3 票已經全部投完，明天可以再投 3 票。");
        return;
      }

      const work = works.find(item => item.id === activeWorkId);
      if (!work) return;

      const confirmed = confirm(
        `確定要投給「${work.title}」嗎？\n\n每個 LINE 帳號每天可投 3 票，同一作品不可重複投。\n你目前還有 ${remainingVotes} 票。`
      );

      if (!confirmed) return;

      document.querySelectorAll("[data-vote-work]").forEach(button => {
        button.disabled = true;
      });
      if (modalVoteButton) modalVoteButton.disabled = true;

      try {
        const response = await fetch(VOTE_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${currentSession}`
          },
          body: JSON.stringify({
            workId: activeWorkId
          })
        });

        const data = await response.json().catch(() => ({}));

        if (response.status === 401) {
          sessionStorage.removeItem("sanyingVoteSession");
          currentSession = "";
          setLoggedOut("登入已失效，請重新使用 LINE 登入。");
          alert("登入已失效，請重新登入 LINE。");
          return;
        }

        if (response.status === 409) {
          todayVoteWorkIds = Array.isArray(data.todayVoteWorkIds)
            ? data.todayVoteWorkIds
            : todayVoteWorkIds;
          remainingVotes = Number.isFinite(data.remainingVotes)
            ? data.remainingVotes
            : Math.max(0, 3 - todayVoteWorkIds.length);

          loginStatusText.textContent =
            remainingVotes > 0
              ? `今天可投 3 票，已投 ${3 - remainingVotes} 票，還有 ${remainingVotes} 票；同一作品不可重複投。`
              : "今天的 3 票已全部投完，明天 00:00（台灣時間）可再投 3 票。";

          updateVoteButtons();
          alert(data.message || "今天無法再投這件作品。");
          return;
        }

        if (!response.ok || !data.ok) {
          throw new Error(data.message || "投票失敗");
        }

        todayVoteWorkIds = Array.isArray(data.todayVoteWorkIds)
          ? data.todayVoteWorkIds
          : [...todayVoteWorkIds, activeWorkId];

        remainingVotes = Number.isFinite(data.remainingVotes)
          ? data.remainingVotes
          : Math.max(0, 3 - todayVoteWorkIds.length);

        if (typeof data.voteCount === "number") {
          work.voteCount = data.voteCount;
          updateVoteCountDisplay(work.id);
        } else {
          await loadVoteStats();
        }

        loginStatusText.textContent =
          remainingVotes > 0
            ? `投票成功！今天還有 ${remainingVotes} 票；同一作品不可重複投。`
            : "今日 3 票已全部投完，明天 00:00（台灣時間）可再投 3 票。";

        updateVoteButtons();

        showVoteToast(data.message || "投票成功！");
        alert(data.message || "投票成功！");
      } catch (error) {
        console.error("vote error:", error);
        showVoteToast("投票失敗，請稍後再試。", true);
        alert("投票失敗，請稍後再試。");
        updateVoteButtons();
      }
    }

    lineLoginButton.addEventListener("click", goToLineLogin);

    if (modalVoteButton) {
      modalVoteButton.addEventListener("click", () => handleVoteIntent(activeWorkId));
    }

    /* 使用事件委派，確保動態產生的作品按鈕都能正常點擊 */
    grid.addEventListener("click", (event) => {
      const voteButton = event.target.closest("[data-vote-work]");

      if (voteButton && grid.contains(voteButton)) {
        event.preventDefault();
        event.stopPropagation();
        handleVoteIntent(voteButton.dataset.voteWork);
        return;
      }

      const openButton = event.target.closest("[data-open-work]");

      if (openButton && grid.contains(openButton)) {
        event.preventDefault();
        openWork(openButton.dataset.openWork);
      }
    });

    function renderWorks() {
      grid.innerHTML = works.map(work => `
        <article class="work-card">
          <div class="work-collage" data-open-work="${work.id}" aria-label="查看作品 ${work.number}">
            ${work.photos.map(photo => `
              <div class="work-thumb" style="--thumb-bg:url('${photo.src}')">
                <div class="work-thumb-bg" aria-hidden="true"></div>
                <img src="${photo.src}" alt="${work.title}" loading="lazy">
              </div>
            `).join("")}
          </div>

          <div class="work-card-body">
            <div class="work-meta-row">
              <span class="work-number">作品編號 ${work.number}</span>
              <span class="work-votes" data-vote-count="${work.id}">
                目前 ${Number(work.voteCount || 0).toLocaleString("zh-TW")} 票
              </span>
            </div>
            <p class="work-author">參賽者｜<strong>${work.participant || "未提供"}</strong></p>
            <h3>${work.title}</h3>

            <div class="work-actions">
              <button class="work-detail-button" type="button" data-open-work="${work.id}">
                查看完整作品
              </button>
              <button class="vote-button" type="button" data-vote-work="${work.id}">
                投這一票
              </button>
            </div>
          </div>
        </article>
      `).join("");

      updateVoteButtons();
    }

    function openWork(workId) {
      const work = works.find(item => item.id === workId);
      if (!work) return;
      activeWorkId = workId;

      modalNumber.textContent =
        `作品編號 ${work.number} ・ 目前 ${Number(work.voteCount || 0).toLocaleString("zh-TW")} 票`;
      modalAuthor.innerHTML = `參賽者｜<strong>${work.participant || "未提供"}</strong>`;
      modalTitle.textContent = work.title;
      modalDescription.textContent = work.description;

      modalPhotos.innerHTML = work.photos.map((photo, index) => `
        <figure class="work-photo-item">
          <img src="${photo.src}" alt="${work.title} 第 ${index + 1} 張照片">
          <figcaption class="work-photo-title ${photo.title ? "has-title" : ""}">
            ${photo.title || ""}
          </figcaption>
        </figure>
      `).join("");

      modal.classList.add("is-open");
      modal.setAttribute("aria-hidden", "false");
      document.body.classList.add("work-modal-open");
      updateVoteButtons();
    }

    function closeWork() {
      modal.classList.remove("is-open");
      modal.setAttribute("aria-hidden", "true");
      document.body.classList.remove("work-modal-open");
    }

    document.querySelectorAll("[data-close-work-modal]").forEach(button => {
      button.addEventListener("click", closeWork);
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && modal.classList.contains("is-open")) {
        closeWork();
      }
    });

    /* 手機導覽列 */
    const menuToggle = document.querySelector(".menu-toggle");
    const mainNav = document.querySelector(".main-nav");

    if (menuToggle && mainNav) {
      menuToggle.addEventListener("click", () => {
        const isOpen = mainNav.classList.toggle("is-open");
        menuToggle.classList.toggle("is-active", isOpen);
        menuToggle.setAttribute("aria-expanded", String(isOpen));
      });
    }

    renderWorks();
    loadVoteStats();
    checkSession();
  </script>
</body>
</html>
