<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人氣票選｜悠遊三鶯</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    :root{
      --vote-blue:#0b789e;
      --vote-deep:#124b63;
      --vote-green:#57c78f;
      --vote-pink:#ef7086;
      --vote-soft:#f3fbfd;
      --vote-text:#5c7f8e;
    }

    body{
      background:var(--vote-soft);
    }

    .vote-page{
      padding:120px 24px 90px;
    }

    .vote-container{
      width:min(1180px,100%);
      margin:0 auto;
    }

    .vote-heading{
      max-width:820px;
      margin:0 auto 38px;
      text-align:center;
    }

    .vote-heading .section-en{
      display:block;
      margin-bottom:8px;
      color:var(--vote-pink);
      font-size:12px;
      font-weight:900;
      letter-spacing:.16em;
    }

    .vote-heading h1{
      margin:0 0 14px;
      color:var(--vote-deep);
      font-size:clamp(38px,6vw,64px);
      line-height:1.15;
      font-weight:900;
    }

    .vote-heading p{
      margin:0 auto;
      max-width:720px;
      color:var(--vote-text);
      font-size:16px;
      line-height:1.85;
    }

    .vote-status{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      max-width:880px;
      margin:0 auto 42px;
      padding:20px 24px;
      border:1px solid rgba(11,120,158,.08);
      border-radius:20px;
      background:#fff;
      box-shadow:0 14px 35px rgba(10,93,126,.07);
    }

    .vote-status strong{
      display:block;
      margin-bottom:5px;
      color:var(--vote-deep);
      font-size:18px;
    }

    .vote-status p{
      margin:0;
      color:var(--vote-text);
      font-size:14px;
      line-height:1.65;
    }

    .vote-status-badge{
      flex:0 0 auto;
      padding:9px 14px;
      border-radius:999px;
      background:#fff3c8;
      color:#9a6d00;
      font-size:13px;
      font-weight:900;
    }

    .works-title{
      display:flex;
      align-items:end;
      justify-content:space-between;
      gap:16px;
      margin-bottom:18px;
    }

    .works-title h2{
      margin:0;
      color:var(--vote-deep);
      font-size:28px;
      font-weight:900;
    }

    .works-title span{
      color:#7898a5;
      font-size:13px;
    }

    .works-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:24px;
    }

    .work-card{
      overflow:hidden;
      border-radius:24px;
      background:#fff;
      box-shadow:0 14px 38px rgba(8,125,167,.08);
      transition:transform .2s ease,box-shadow .2s ease;
    }

    .work-card:hover{
      transform:translateY(-3px);
      box-shadow:0 18px 42px rgba(8,125,167,.12);
    }

    .work-collage{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:3px;
      background:#dcecef;
      cursor:pointer;
    }

    .work-thumb{
      position:relative;
      aspect-ratio:1 / 1;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#eaf4f6;
    }

    .work-thumb-bg{
      position:absolute;
      inset:-18px;
      background-image:var(--thumb-bg);
      background-position:center;
      background-size:cover;
      filter:blur(16px);
      opacity:.48;
      transform:scale(1.12);
    }

    .work-thumb::after{
      content:"";
      position:absolute;
      inset:0;
      background:rgba(255,255,255,.08);
      pointer-events:none;
    }

    .work-thumb img{
      position:relative;
      z-index:1;
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
      filter:drop-shadow(0 2px 7px rgba(0,0,0,.08));
    }

    .work-card-body{
      padding:22px;
    }

    .work-number{
      display:inline-flex;
      align-items:center;
      min-height:28px;
      padding:0 11px;
      border-radius:999px;
      background:#fff0f3;
      color:var(--vote-pink);
      font-size:11px;
      font-weight:900;
      letter-spacing:.08em;
    }

    .work-card h3{
      margin:12px 0 18px;
      color:var(--vote-deep);
      font-size:21px;
      line-height:1.45;
      font-weight:900;
    }

    .work-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .work-detail-button,
    .vote-button{
      min-height:48px;
      padding:0 14px;
      border-radius:999px;
      font-family:inherit;
      font-size:14px;
      font-weight:900;
      cursor:pointer;
    }

    .work-detail-button{
      border:2px solid #d2e7ee;
      background:#fff;
      color:var(--vote-blue);
    }

    .vote-button{
      border:0;
      background:linear-gradient(135deg,var(--vote-blue),var(--vote-green));
      color:#fff;
    }

    .vote-button[disabled]{
      cursor:not-allowed;
      opacity:.55;
    }

    /* 作品完整內容彈窗 */
    .work-modal{
      position:fixed;
      inset:0;
      z-index:9999;
      display:none;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .work-modal.is-open{
      display:flex;
    }

    .work-modal-backdrop{
      position:absolute;
      inset:0;
      background:rgba(6,33,44,.72);
      backdrop-filter:blur(6px);
    }

    .work-modal-dialog{
      position:relative;
      z-index:1;
      width:min(980px,100%);
      max-height:90vh;
      overflow:auto;
      border-radius:26px;
      background:#fff;
      box-shadow:0 30px 90px rgba(0,0,0,.28);
    }

    .work-modal-close{
      position:sticky;
      top:14px;
      float:right;
      z-index:5;
      width:42px;
      height:42px;
      margin:14px 14px -56px 0;
      border:0;
      border-radius:50%;
      background:rgba(17,67,86,.92);
      color:#fff;
      font-size:26px;
      line-height:1;
      cursor:pointer;
    }

    .work-modal-inner{
      padding:36px;
    }

    .work-modal-kicker{
      color:var(--vote-pink);
      font-size:12px;
      font-weight:900;
      letter-spacing:.12em;
    }

    .work-modal h2{
      margin:8px 0 18px;
      padding-right:48px;
      color:var(--vote-deep);
      font-size:clamp(28px,4vw,42px);
      line-height:1.3;
      font-weight:900;
    }

    .work-description{
      margin:0 0 28px;
      color:#557987;
      font-size:15px;
      line-height:1.95;
      white-space:pre-line;
    }

    .work-photo-list{
      display:grid;
      gap:20px;
    }

    .work-photo-item{
      overflow:hidden;
      border-radius:18px;
      background:#f5fafb;
    }

    .work-photo-item img{
      display:block;
      width:100%;
      height:auto;
      max-height:76vh;
      object-fit:contain;
      background:#eef6f8;
    }

    .work-photo-title{
      display:none;
      padding:12px 16px 14px;
      color:var(--vote-deep);
      font-size:14px;
      font-weight:800;
    }

    .work-photo-title.has-title{
      display:block;
    }

    .modal-vote-wrap{
      margin-top:28px;
      text-align:center;
    }

    .modal-vote-wrap .vote-button{
      width:min(360px,100%);
      min-height:54px;
      font-size:15px;
    }

    body.work-modal-open{
      overflow:hidden;
    }

    @media(max-width:900px){
      .works-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }
    }

    @media(max-width:640px){
      .vote-page{
        padding:100px 16px 65px;
      }

      .vote-status{
        align-items:flex-start;
        flex-direction:column;
      }

      .works-grid{
        grid-template-columns:1fr;
      }

      .work-actions{
        grid-template-columns:1fr;
      }

      .work-modal{
        padding:10px;
      }

      .work-modal-inner{
        padding:26px 18px 22px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="index.html" aria-label="悠遊三鶯首頁">
        <img class="site-logo-image" src="images/logo.png" alt="悠遊三鶯">
      </a>

      <button class="menu-toggle" type="button" aria-label="開啟選單" aria-controls="main-nav" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <nav class="main-nav" id="main-nav">
        <a href="index.html#news">最新消息</a>
        <a href="index.html#about">活動介紹</a>
        <a href="index.html#events">系列活動</a>
        <a href="index.html#shops">合作店家優惠</a>
        <a href="index.html#photo">攝影比賽專區</a>
        <a href="index.html#video">影音專區</a>
      </nav>
    </div>
  </header>

  <main class="vote-page">
    <div class="vote-container">

      <section class="vote-heading">
        <span class="section-en">PHOTO CONTEST VOTE</span>
        <h1>我的四格旅行<br>人氣票選</h1>
        <p>
          每組作品由 4 張照片共同呈現一段三鶯旅行故事。
          欣賞完整作品後，登入 LINE 為你最喜歡的作品投下一票。
        </p>
      </section>

      <section class="vote-status">
        <div>
          <strong>LINE 投票功能準備中</strong>
          <p>目前先進行作品展示測試。下一階段會加入 LINE 登入與每日投票限制。</p>
        </div>
        <span class="vote-status-badge">展示測試版</span>
      </section>

      <div class="works-title">
        <h2>參賽作品</h2>
        <span>目前測試 1 組｜正式上線共 35 組</span>
      </div>

      <section class="works-grid" id="works-grid"></section>
    </div>
  </main>

  <div class="work-modal" id="work-modal" aria-hidden="true">
    <div class="work-modal-backdrop" data-close-work-modal></div>

    <section class="work-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="work-modal-title">
      <button class="work-modal-close" type="button" aria-label="關閉作品" data-close-work-modal>×</button>

      <div class="work-modal-inner">
        <span class="work-modal-kicker" id="work-modal-number"></span>
        <h2 id="work-modal-title"></h2>
        <p class="work-description" id="work-modal-description"></p>

        <div class="work-photo-list" id="work-modal-photos"></div>

        <div class="modal-vote-wrap">
          <button class="vote-button" type="button" disabled>LINE 登入後投這一票</button>
        </div>
      </div>
    </section>
  </div>

  <script>
    /* ==========================
       作品資料
       之後第 02～35 組都加在這裡
    ========================== */
    const works = [
      {
        id: "work01",
        number: "01",
        title: "捷運三鶯線的三峽地標－台北大學",
        description: "從三峽捷運線開通之後，觀光客假日擠在三峽老街，其實在三峽老街附近，還有一個台北大學，是一所藏著許多裝置藝術的寶藏學府。\n\n在校園裡，除了風光明媚的心湖，以及深受小朋友喜愛的黑天鵝之外，近年也陸續設置了許多裝置藝術，讓漫步校園的過程多了幾分浪漫與藝術氣息。\n\n如果來到三峽老街吃飽喝足，不妨再走進台北大學，慢慢欣賞這座校園裡的藝術風景，讓一趟三峽旅行，不只停留在美食與老街，也多一份心靈上的收穫。",
        photos: [
          { src: "images/works/work01-01.jpeg", title: "" },
          { src: "images/works/work01-02.jpeg", title: "" },
          { src: "images/works/work01-03.jpeg", title: "" },
          { src: "images/works/work01-04.jpeg", title: "" }
        ]
      }
    ];

    const grid = document.getElementById("works-grid");
    const modal = document.getElementById("work-modal");
    const modalNumber = document.getElementById("work-modal-number");
    const modalTitle = document.getElementById("work-modal-title");
    const modalDescription = document.getElementById("work-modal-description");
    const modalPhotos = document.getElementById("work-modal-photos");

    function renderWorks() {
      grid.innerHTML = works.map(work => `
        <article class="work-card">
          <div class="work-collage" data-open-work="${work.id}" aria-label="查看作品 ${work.number}">
            ${work.photos.map(photo => `
              <div class="work-thumb" style="--thumb-bg:url('${photo.src}')">
                <div class="work-thumb-bg" aria-hidden="true"></div>
                <img src="${photo.src}" alt="${work.title}" loading="lazy">
              </div>
            `).join("")}
          </div>

          <div class="work-card-body">
            <span class="work-number">作品編號 ${work.number}</span>
            <h3>${work.title}</h3>

            <div class="work-actions">
              <button class="work-detail-button" type="button" data-open-work="${work.id}">
                查看完整作品
              </button>
              <button class="vote-button" type="button" disabled>
                投這一票
              </button>
            </div>
          </div>
        </article>
      `).join("");

      document.querySelectorAll("[data-open-work]").forEach(button => {
        button.addEventListener("click", () => openWork(button.dataset.openWork));
      });
    }

    function openWork(workId) {
      const work = works.find(item => item.id === workId);
      if (!work) return;

      modalNumber.textContent = `作品編號 ${work.number}`;
      modalTitle.textContent = work.title;
      modalDescription.textContent = work.description;

      modalPhotos.innerHTML = work.photos.map((photo, index) => `
        <figure class="work-photo-item">
          <img src="${photo.src}" alt="${work.title} 第 ${index + 1} 張照片">
          <figcaption class="work-photo-title ${photo.title ? "has-title" : ""}">
            ${photo.title || ""}
          </figcaption>
        </figure>
      `).join("");

      modal.classList.add("is-open");
      modal.setAttribute("aria-hidden", "false");
      document.body.classList.add("work-modal-open");
    }

    function closeWork() {
      modal.classList.remove("is-open");
      modal.setAttribute("aria-hidden", "true");
      document.body.classList.remove("work-modal-open");
    }

    document.querySelectorAll("[data-close-work-modal]").forEach(button => {
      button.addEventListener("click", closeWork);
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && modal.classList.contains("is-open")) {
        closeWork();
      }
    });

    /* 手機導覽列 */
    const menuToggle = document.querySelector(".menu-toggle");
    const mainNav = document.querySelector(".main-nav");

    if (menuToggle && mainNav) {
      menuToggle.addEventListener("click", () => {
        const isOpen = mainNav.classList.toggle("is-open");
        menuToggle.classList.toggle("is-active", isOpen);
        menuToggle.setAttribute("aria-expanded", String(isOpen));
      });
    }

    renderWorks();
  </script>
</body>
</html>
